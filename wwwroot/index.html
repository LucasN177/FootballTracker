<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Football Tracker – Tabellen, Spieltage, Live Scores, Statistiken und Player Tracker für Bundesliga, 2. Bundesliga, 3. Liga, DFB-Pokal und Champions League." />
    <meta name="theme-color" content="#d20a11" />
    <title>Football Tracker</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
    <link href="_content/MudBlazor/MudBlazor.min.css?v=2" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="Resources/img/Icon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="Resources/img/Icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="Resources/img/Icon.png" />
</head>

<body>
<div id="app">
    <div class="app-loader">
        <img src="Resources/img/Icon.png" class="loader-logo" alt="Football Tracker" />

        <div class="loader-bar-container">
            <div class="loader-bar"></div>
        </div>

        <div class="loader-text">Football Tracker wird geladen...</div>
    </div>
</div>

    <div id="blazor-error-ui">
        Es ist ein unerwarteter Fehler aufgetreten.
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
    <script src="_content/MudBlazor/MudBlazor.min.js?v=2"></script>

    <script>
        window.ftScrollIntoView = id => document.getElementById(id)?.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
        navigator.serviceWorker.register("service-worker.js");
    </script>
</body>

</html>
